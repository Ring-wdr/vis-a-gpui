[workspace]
resolver = "2"
members = ["crates/vis-core", "crates/vis-app"]
default-members = ["crates/vis-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
