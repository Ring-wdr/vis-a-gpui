[package]
name = "vis-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "vis-a-lot의 데이터·집계·렌더 엔진을 Rust로 옮긴 것 (UI 없음)"

[dependencies]
rayon = "1.10"
tiny-skia = "0.11"
ab_glyph = "0.2"
fontdb = "0.23"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6"
parking_lot = "0.12"

[[bin]]
name = "vis-bench"
path = "src/bin/vis-bench.rs"
