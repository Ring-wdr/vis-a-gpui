[package]
name = "vis-a-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "vis-a-lot 시각화 화면을 GPUI(gpui-kit)로 옮긴 Windows 데스크톱 앱"

[[bin]]
name = "vis-a-gpui"
path = "src/main.rs"

[dependencies]
vis-core = { path = "../vis-core" }
gpui-kit = "0.9.0"
smallvec = "1"
image = { version = "0.25", default-features = false }
parking_lot = "0.12"
serde_json = "1"
rust_xlsxwriter = "0.102.0"
rayon = "1.10"
